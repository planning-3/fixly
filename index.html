<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(-10 16 16)'%3E%3Cpath fill='%232d6a3a' d='M4 6H28A3 3 0 0 1 31 9V12.5A3.5 3.5 0 0 0 31 19.5V23A3 3 0 0 1 28 26H4A3 3 0 0 1 1 23V19.5A3.5 3.5 0 0 0 1 12.5V9A3 3 0 0 1 4 6Z'/%3E%3Cpath d='M21.5 10V22' stroke='white' stroke-width='2' stroke-dasharray='2.5 2.5'/%3E%3C/g%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>fixly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽 좁은 메뉴 + 오른쪽 작업 영역, 상세는 오른쪽에서 밀려 나오는 패널. 매일 여는 업무 도구라 장식 없이 줄·여백·한 가지 강조색으로 구분 */
:root{
  --bg:#f5f6f5; --surface:#ffffff; --sunk:#eff1ef; --line:#e1e4e1; --line-2:#ebedeb;
  /* VER10: 흐린 글씨(--faint)를 읽을 수 있는 대비로 올림(흰 바탕 2.6:1 → 4.6:1). 어두운 화면 값도 같이 올림 */
  --fg:#1a1e1b; --muted:#687068; --faint:#6f7770;
  --accent:#2d6a3a; --accent-fg:#ffffff; --accent-soft:#e6f0e7;
  --red:#c2362b; --red-soft:#fbe9e7; --amber:#a5620a; --amber-soft:#faf0de; --blue:#2f5f9e; --blue-soft:#e8eef8;
  --shadow:0 8px 28px rgba(20,30,22,.12);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs:13px; --fs-s:12px; --fs-xs:11px; --fs-h:15px; --fs-hh:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --surface:#181c19; --sunk:#1e2320; --line:#2b312c; --line-2:#232824;
  --fg:#e4e8e4; --muted:#9aa29b; --faint:#8a928b;
  --accent:#7fc089; --accent-fg:#0f1a11; --accent-soft:#1d3020;
  --red:#ff7b6f; --red-soft:#3a1e1b; --amber:#efb35c; --amber-soft:#3a2b13; --blue:#8db4ec; --blue-soft:#1b2638;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#181c19; --sunk:#1e2320; --line:#2b312c; --line-2:#232824;
  --fg:#e4e8e4; --muted:#9aa29b; --faint:#8a928b;
  --accent:#7fc089; --accent-fg:#0f1a11; --accent-soft:#1d3020;
  --red:#ff7b6f; --red-soft:#3a1e1b; --amber:#efb35c; --amber-soft:#3a2b13; --blue:#8db4ec; --blue-soft:#1b2638;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:var(--fs)/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:14px 10px;gap:4px;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px;font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand svg{flex:none;transform:rotate(-10deg)}
.brand .tk{fill:var(--accent)}
.brand .cut{stroke:var(--accent-fg);stroke-width:1.5;stroke-dasharray:2 2}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--muted);text-decoration:none}
.nav a:hover{background:var(--sunk);color:var(--fg)}
.nav a[aria-current]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .cnt{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint)}
.nav .cnt.hot{color:var(--red);font-weight:500}
.side .foot{margin-top:auto;border-top:1px solid var(--line-2);padding:12px 8px 0;font-size:var(--fs-s);color:var(--muted);display:flex;flex-direction:column;gap:6px}
.side .foot b{color:var(--fg);font-weight:600}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:2px;font-size:var(--fs-xs);text-align:left}

.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-size:var(--fs-hh);font-weight:600;margin:0;margin-right:6px}
.top .sub{color:var(--muted);font-size:var(--fs-s)}
.grow{flex:1}
.body{flex:1;min-height:0;overflow:auto;padding-block:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:26px;padding:0 9px;font-size:var(--fs-s)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--sunk)}
.btn.danger{color:var(--red)}
.inp,.sel{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 9px;min-width:0}
.inp.wide{width:220px;max-width:100%}
.sel{padding-right:24px}
textarea.inp{height:auto;padding:8px 9px;width:100%;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{padding:5px 10px;color:var(--muted);border-right:1px solid var(--line-2);font-size:var(--fs-s)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.seg .n{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);margin-left:4px}

.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font-size:var(--fs-xs);font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--accent-soft);color:var(--accent)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:var(--faint)}
.dot.긴급{background:var(--red)} .dot.높음{background:var(--amber)} .dot.보통{background:var(--line);box-shadow:inset 0 0 0 1px var(--faint)}
.av{width:20px;height:20px;border-radius:50%;background:var(--sunk);color:var(--muted);display:inline-grid;place-items:center;font-size:10px;font-weight:600;flex:none}

/* 보드 */
.board{display:flex;gap:14px;align-items:stretch;min-width:0}.board>.col{flex:1 1 0;min-width:240px}.board>.donecol{flex:0 1 290px;min-width:230px;margin-left:auto;align-self:flex-start}.board>.donecol:not(.open){min-height:0;padding-bottom:4px}
.board .col:not(.donecol){min-height:calc(100vh - 100px)}
.seg.mview+.boardwrap .col:not(.donecol){min-height:calc(100vh - 146px)}
@media (max-width:860px){.board .col:not(.donecol),.seg.mview+.boardwrap .col:not(.donecol){min-height:420px}}
.donecol{min-height:0}
.donecol:not(.open) .empty{padding:6px 4px 8px}
.boardwrap{overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:200px}

.colh{display:flex;align-items:center;gap:6px;padding:2px 4px 4px;font-weight:600;font-size:var(--fs-s)}
.colh .num{color:var(--faint);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card:hover{border-color:var(--faint)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .t{display:flex;gap:7px;align-items:baseline;font-weight:500;line-height:1.4}
.card .t .dot{transform:translateY(-1px)}
.card .m{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:var(--fs-xs);flex-wrap:wrap}
.card .m .due{color:var(--red)}
.card .m .grow{min-width:4px}
.empty{color:var(--faint);font-size:var(--fs-s);padding:10px 4px;text-align:center}

/* 표 */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tblwrap{overflow-x:auto;border-radius:8px}
.tbl th{font-weight:500;color:var(--muted);font-size:var(--fs-s);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl .r{text-align:right}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--fg)}
.tbl th.sortable .arrow{font-size:10px;color:var(--faint)}
.tbl th.sortable.on .arrow{color:var(--accent)}
/* 통계 카드 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .sh{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.stat .sh .l{font-weight:600;font-size:var(--fs-s);color:var(--muted)}
.kpp{display:inline-flex;gap:4px}
.kpp .sel,.kpp .inp{height:24px;font-size:var(--fs-xs);padding:0 4px}
.kpp .sel{padding-right:18px}
.stat .sb{display:flex;align-items:center;gap:12px;min-height:72px}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.stat .v .sub{font-family:var(--sans);font-size:var(--fs-s);color:var(--muted);font-weight:400}
.stat .basis{font-size:var(--fs-xs);color:var(--muted)} /* VER10(hallmark A4): --faint는 2.64:1이라 --muted(5.11:1)로 */
.donut{flex:none}
.donut text{font-family:var(--mono)}
.tbl .clip{max-width:440px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .s{font-size:var(--fs-s)} .xs{font-size:var(--fs-xs)}

/* 패널 */
.scrim{position:fixed;inset:0;background:rgba(15,20,16,.28);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.ph{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:var(--fs-h);font-weight:600;line-height:1.4;text-wrap:balance}
.ph .id{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);margin-bottom:2px}
.pb{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.pf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{width:28px;height:28px;border-radius:6px;color:var(--muted);font-size:18px;line-height:1;flex:none;margin-left:auto}
.x:hover{background:var(--sunk);color:var(--fg)}
.fields{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 10px;align-items:center}
.fields label{color:var(--muted);font-size:var(--fs-s)}
.fields .sel,.fields .inp{width:100%}
.sec h3{margin:0 0 8px;font-size:var(--fs-s);font-weight:600;color:var(--muted)}
.rv{border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.rv .meta{font-size:var(--fs-xs);color:var(--faint)}
.rv mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:2px}
.list{display:flex;flex-direction:column;gap:6px}
.cm{display:flex;gap:8px}
.cm .b{background:var(--sunk);border-radius:6px;padding:6px 9px;flex:1;min-width:0}
.cm .who{font-size:var(--fs-xs);color:var(--muted)}
.tfs{display:flex;flex-direction:column;gap:10px}
.tf{display:flex;flex-direction:column;gap:4px}
.tf .k{display:flex;align-items:center;gap:6px;font-size:var(--fs-s);color:var(--muted)}
.trace{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:4px}
.trace div{position:relative;padding:2px 0 8px 14px;font-size:var(--fs-s)}
.trace div::before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--faint)}
.trace div.key::before{border-color:var(--accent);background:var(--accent)}
.trace b{font-weight:600}

/* 모달 */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(15,20,16,.35)}
.modal form,.modal .box{max-height:calc(100vh - 32px);overflow:auto;width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:var(--fs-h);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-s);color:var(--muted)}
.fl .inp,.fl .sel{width:100%;color:var(--fg);font-size:var(--fs)}

/* 성과 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{color:var(--muted);font-size:var(--fs-s)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.kpi .d{font-size:var(--fs-xs);color:var(--muted)}
.kpi .d.up{color:var(--accent)} .kpi .d.down{color:var(--red)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.block h2{font-size:var(--fs-s);font-weight:600;color:var(--muted);margin:0 0 8px}
.stack{display:flex;flex-direction:column;gap:16px}
.watch{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.watch div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.watch div:last-child{border-bottom:0}
.watch .t{flex:1;min-width:0}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.red i{background:var(--red)}
.note{font-size:var(--fs-xs);color:var(--faint)}

/* 규칙 */
.explain{font-size:var(--fs-s);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.explain b{color:var(--fg);font-weight:600}
.tester{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tester .row{display:flex;gap:8px;flex-wrap:wrap}
.tester .row .inp{flex:1;min-width:200px}
.result{font-size:var(--fs-s);padding:8px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line-2)}
.kw{display:inline;padding:0 3px;border-radius:3px;background:var(--sunk);font-weight:500}
.sect{font-size:var(--fs-xs);color:var(--muted);font-weight:600;letter-spacing:.04em;padding:10px 10px 6px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rule{display:grid;grid-template-columns:18px 34px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line-2);cursor:pointer}
.rule:last-child{border-bottom:0}
.rule:hover{background:var(--sunk)}
.rule.sel{background:var(--accent-soft)}
.rule.dim{opacity:.38}
.rule.off .sent{color:var(--faint);text-decoration:line-through}
.rule .h{color:var(--faint);cursor:grab;font-size:12px;user-select:none}
.rule .h.lock{cursor:default}
.rule .no{font-family:var(--mono);color:var(--muted);font-size:var(--fs-s)}
.rule .sent{min-width:0}
.rule .stat{font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);text-align:right;white-space:nowrap}
.rule.dragging{opacity:.5}
.rule .stat{display:block;border:0;border-radius:0;padding:0;background:none}
.sw{position:relative;width:30px;height:18px;border-radius:9px;background:var(--line);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(12px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:7px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .n{font-family:var(--mono);font-size:var(--fs-xs);margin-left:4px;color:var(--faint)}
.tabs .n.hot{color:var(--red)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
.spark{display:block}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:var(--fs-s);z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast[hidden]{display:none!important}
/* VER10: 오류·긴 안내가 남는 줄. 화면 제목 바로 아래, 닫기 전까지 유지 */
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--red-soft);color:var(--fg);border-bottom:1px solid var(--line);font-size:var(--fs);line-height:1.5}
.notice.info{background:var(--blue-soft)}
.notice[hidden]{display:none!important}
.notice .btn{flex:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

/* VER9: 티켓 창 탭(티켓 정보 / 근거 리뷰 · AI 추천). 머리 아래 한 줄, 고른 탭은 아래 초록 줄 */
.ttabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.ttabs [role=tab]{padding:9px 10px 8px;margin-bottom:-1px;color:var(--muted);font-size:var(--fs-s);font-weight:500;border-bottom:2px solid transparent}
.ttabs [role=tab]:hover{color:var(--fg)}
.ttabs [role=tab][aria-selected=true]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.ttabs .num{color:var(--faint);font-weight:500}
.ttabs [role=tab][aria-selected=true] .num{color:var(--accent)}
.ttabs [role=tab]{display:inline-flex;align-items:center;gap:5px}
.ttabs .aiic{width:13px;height:13px;fill:var(--faint)}
.ttabs [role=tab][aria-selected=true] .aiic,.ttabs [role=tab]:hover .aiic{fill:var(--accent)}
/* 근거 리뷰 탭: 리뷰 카드가 전체 폭이라 본문은 왼쪽, 별점·버전·날짜는 오른쪽 한 줄 */
.tkbox .pb .tkfull .rv{flex-direction:row;align-items:baseline;justify-content:space-between;gap:16px}
.tkbox .pb .tkfull .rv .meta{flex:none;white-space:nowrap}
/* VER9: 티켓 정보 탭 폼 배치. 위 선택 칸 3열(상태는 한 줄), 가운데 티켓 내용 2열, 아래 댓글 */
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.fgrid .fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid .fg>label{color:var(--muted);font-size:var(--fs-s)}
.fgrid .fg.stat{grid-column:1/-1}
.fgrid .sel,.fgrid .inp{width:100%}
/* 티켓 내용: AI 추천 상자처럼 테두리 + 바탕색 상자. 칸 6개를 여섯 줄로, 한 줄은 왼쪽 이름(꼬리표) + 오른쪽 입력란이 가로로 길게 */
.tkform .sec.tkcontent{border:1px solid var(--line-2);border-radius:10px;padding:14px;background:var(--bg)}
.tkform .tfs{display:flex;flex-direction:column;gap:8px}
.tkform .tfs .tf{display:grid;grid-template-columns:132px minmax(0,1fr);gap:0 12px;align-items:start;min-width:0}
.tkform .tfs .tf .k{padding-top:7px;flex-wrap:wrap}
.tkform .tfs textarea{min-height:40px;resize:vertical}
@media (max-width:860px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.tkform .tfs .tf{grid-template-columns:minmax(0,1fr)}.tkform .tfs .tf .k{padding-top:0}}
/* 근거 리뷰 목록은 창 전체가 아니라 목록 안에서 스크롤. 아래 '이렇게 분류됐어요'는 늘 보임 */
.tkbox .pb .tkfull .rvlist{overflow:auto;padding-right:4px;scrollbar-gutter:stable;position:relative}
.tkbox .pb .tkfull .rvlist.allrv{max-height:min(46vh,420px)} /* 실제 높이는 fitRvList()가 앞 5장 기준으로 다시 정함 */
/* VER9: AI 추천을 두 칸 아래 전체 폭에. 넓어진 만큼 '1. 이전 처리'와 '2. 고객 응대'를 좌우로 나눔(좁은 화면은 위아래) */
.tkbox .pb .tkfull{grid-column:1/-1;min-width:0}
.tkfull .ainext{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 24px;align-items:start}
.tkfull .ainext>h3,.tkfull .ainext>.aifoot{grid-column:1/-1}
@media (max-width:860px){.tkfull .ainext{grid-template-columns:minmax(0,1fr)}}
.card{position:relative}
.card .urg{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:var(--fs-xs);font-weight:600;line-height:18px;padding:0 7px;border-radius:4px}
.card.has-urg .t{padding-right:44px}
/* VER8: 시작 화면 · 회사 전환 · 연결한 앱 */
#start{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto}
body.st-on{overflow:hidden}

.stbox.run{width:min(600px,100%);gap:18px}
.stx{position:absolute;top:14px;right:14px}

.stfield{display:flex;flex-direction:column;gap:6px}

#st-url,.storg-btn{width:100%;height:44px;font-size:15px}

.storg-btn.ph{color:var(--faint)}
.storg-btn .tri{margin-left:auto;color:var(--muted);font-size:12px}
.storg-list,.stxl-m{position:absolute;left:0;top:calc(100% + 6px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.storg-list{right:0;max-height:360px;overflow:auto}
.storg-h{padding:6px 8px 2px}

.storg-i:hover{background:var(--sunk)}

.stxl{position:relative;flex:none}

.stxl-m button:hover{background:var(--sunk)}
.sterr-i{color:var(--red);font-size:var(--fs-s);text-align:center;margin:-8px 0 -6px}
.sterr-i:empty{display:none}
.stgo{align-self:center;display:inline-flex;align-items:center;justify-content:center;text-align:center;height:40px;min-width:150px;padding:0 28px;font-size:15px;font-weight:600;margin-top:6px}
.sttitle{margin:2px 0 0;font-size:20px}
.stinfo{border-top:1px solid var(--line-2);padding-top:14px;font-size:var(--fs-s);line-height:1.65;color:var(--muted)}

.stinfo li b{color:var(--fg);font-weight:600}
.comenu .av{width:28px;height:28px;font-size:13px;font-weight:700}
.stact{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stact .btn{height:40px;padding:0 18px;font-size:var(--fs)}
.strun-h{display:flex;align-items:center;gap:12px}

.strun-h>span{display:flex;flex-direction:column}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.stp{display:flex;align-items:flex-start;gap:12px}

.stp .ic{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line);color:transparent}
.stp.ok .ic{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

@keyframes stspin{to{transform:rotate(360deg)}}
.stsum{display:grid;grid-template-columns:1.45fr repeat(4,1fr);gap:8px}
.stsum span.xs{white-space:nowrap}
.stsum .u{font-size:var(--fs-xs);font-weight:500;margin-left:2px;color:var(--muted)}
.stsum>div{display:flex;flex-direction:column;gap:2px;padding:10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg)}
.stsum b{font-size:20px}
.sterr{color:var(--red);background:var(--red-soft);border-radius:8px;padding:10px 12px;font-size:var(--fs-s);line-height:1.6}
.wsic{display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
/* 왼쪽 메뉴: 초기 화면으로 돌아가기 위 연결한 앱 */
.wsapp{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:8px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);min-width:0}

.wsapp>span:last-child{min-width:0;display:flex;flex-direction:column}
.wsapp b{font-size:var(--fs-s);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cosw{position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.comenu{width:260px}
.comenu .conew{border-top:1px solid var(--line-2);border-radius:0 0 6px 6px}
.resetbtn{margin-top:8px;width:100%;font-size:var(--fs-xs);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:5px 8px;background:transparent;text-align:center}
.resetbtn:hover{color:var(--accent);border-color:var(--accent)}
/* 티켓 상세: 근거 리뷰 전체 보기 */

.list.allrv{max-height:420px;overflow:auto;padding-right:4px}

function matchRule(r,text){if(!r.on)return false;var A=r.a.some(function(k){return text.indexOf(k)>=0});if(!A)return false;return !r.b.length||r.b.some(function(k){return text.indexOf(k)>=0})}

/* 리뷰 테스트용 느슨한 대조: 띄어쓰기·문장부호를 무시하고, 글자 하나 차이(오타)까지 같은 단어로 본다. 실제 분류에는 쓰지 않음 */
function norm(s){return String(s).replace(/[\s.,!?~·'"()\[\]]/g,"")}
function lev1(a,b){if(a===b)return true;var la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;var i=0,j=0,diff=0;while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue}diff++;if(diff>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++}}return diff+(la-i)+(lb-j)<=1}
function fuzzyFind(text,kw){var t=norm(text),k=norm(kw);if(!k)return null;if(t.indexOf(k)>=0)return {found:kw,fixed:false};if(k.length<2)return null;for(var L=k.length-1;L<=k.length+1;L++){if(L<2)continue;for(var i=0;i+L<=t.length;i++){var w=t.substr(i,L);if(lev1(w,k))return {found:w,fixed:true}}}return null}
function matchFuzzy(r,text){if(!r.on)return null;var fixes=[],A=null,i;for(i=0;i<r.a.length;i++){var f=fuzzyFind(text,r.a[i]);if(f){A=f;if(f.fixed)fixes.push([f.found,r.a[i]]);break}}if(!A)return null;if(r.b.length){var B=null;for(i=0;i<r.b.length;i++){var g=fuzzyFind(text,r.b[i]);if(g){B=g;if(g.fixed)fixes.push([g.found,r.b[i]]);break}}if(!B)return null}return {fixes:fixes}}
function firstMatchFuzzy(text){var list=ordered();for(var i=0;i<list.length;i++){var m=matchFuzzy(list[i],text);if(m)return {rule:list[i],no:i+1,fixes:m.fixes}}return null}

function spark(arr,w,h){w=w||64;h=h||18;var mx=Math.max.apply(null,arr.concat([1]));var step=w/(arr.length-1);var pts=arr.map(function(v,i){return [i*step,h-2-(v/mx)*(h-4)]});var d=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}).join(" ");var last=pts[pts.length-1];return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path d="'+d+' L'+w+' '+h+' L0 '+h+' Z" fill="var(--accent-soft)"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="2" fill="var(--accent)"/></svg>'}

/* ---------- 기간 ---------- */
var DAY=864e5;
function today0(){var d=new Date();d.setHours(0,0,0,0);return d}
function fmt(ts){var d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function fmtD(ts){var d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()}
function defaultPeriod(){var t=Math.max.apply(null,S.reviews.map(function(r){return r.ts}));var d=new Date(t),day=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return {mode:"month",date:day,month:day.slice(0,7)}}
function verL(v){return v&&v!=="미상"?"v"+v:"버전 미상"}
/* 조회 범위 {s,e}. 일자를 고르면 그 하루, 월을 고르면 그 달. 기본은 이번 달 */
/* 아래 세 함수는 기간 객체를 받으면 그것을, 없으면 화면 공통 기간(UI.period)을 쓴다 */
function pRangeTs(P){P=P||UI.period;if(P.mode==="all")return {s:-Infinity,e:Infinity};
  if(P.mode==="day"){var s=new Date(P.date+"T00:00:00").getTime();return {s:s,e:s+DAY}}
  var p=P.month.split("-");return {s:new Date(+p[0],+p[1]-1,1).getTime(),e:new Date(+p[0],+p[1],1).getTime()};
}
function pRange(P){P=P||UI.period;if(P.mode==="all")return "전체 기간";
  if(P.mode==="day"){var d=new Date(P.date+"T00:00:00");return (d.getMonth()+1)+"월 "+d.getDate()+"일"}
  var p=P.month.split("-");return p[0]+"년 "+(+p[1])+"월";
}
function prevLabel(P){P=P||UI.period;return P.mode==="day"?"전날":"전달"}
function periodSel(){
  var m=UI.period.mode;
  return '<select class="sel" id="pd-mode" aria-label="기간">'+[["all","전체"],["day","일"],["month","월"]].map(function(p){return '<option value="'+p[0]+'"'+(m===p[0]?" selected":"")+'>'+p[1]+'</option>'}).join("")+'</select>'+
    (m==="all"?'':m==="day"?'<input class="inp" type="date" id="pd-date" value="'+esc(UI.period.date)+'" max="'+dueIn(0)+'" aria-label="일자">':'<input class="inp" type="month" id="pd-month" value="'+esc(UI.period.month)+'" max="'+dueIn(0).slice(0,7)+'" aria-label="월">');
}
/* 그래프 막대. 일자 = 고른 날까지 하루 단위 7칸(고른 날만 강조), 월 = 7일씩 묶음. inR = 조회 범위 안 */
function buckets(){
  var m=UI.period.mode,R=pRangeTs(),t0=today0().getTime(),out=[],i,s;
  if(m==="all"){var ts=S.reviews.map(function(r){return r.ts}),a=new Date(Math.min.apply(null,ts)),b=Math.max.apply(null,ts),d0=new Date(a.getFullYear(),a.getMonth(),1);while(d0.getTime()<=b){var d1=new Date(d0.getFullYear(),d0.getMonth()+1,1);out.push({s:d0.getTime(),e:d1.getTime(),l:(d0.getMonth()+1)+"월",inR:true});d0=d1}return out}
  if(m==="month"){var d=new Date(R.s),y=d.getFullYear(),mo=d.getMonth(),last=new Date(y,mo+1,0).getDate();for(i=1;i<=last;i+=7){var e=Math.min(i+6,last);out.push({s:new Date(y,mo,i).getTime(),e:new Date(y,mo,e+1).getTime(),l:i+"~"+e+"일",inR:true})}}
  else{for(i=6;i>=0;i--){s=R.e-(i+1)*DAY;out.push({s:s,e:s+DAY,l:s===t0?"오늘":s===t0-DAY?"어제":fmtD(s),inR:s>=R.s})}}
  return out;
}
function inP(r,P){var R=pRangeTs(P);return r.ts>=R.s&&r.ts<R.e}
function countBy(list){return buckets().map(function(b){return list.filter(function(r){return r.ts>=b.s&&r.ts<b.e}).length})}
/* 조회 범위 건수와, 같은 길이의 직전 범위 건수 */
function cmpPrev(list){if(UI.period.mode==="all")return {cur:list.length,prev:0};var R=pRangeTs(),len=R.e-R.s;return {cur:list.filter(function(r){return r.ts>=R.s&&r.ts<R.e}).length,prev:list.filter(function(r){return r.ts>=R.s-len&&r.ts<R.s}).length}}
function agoLabel(ts){var d=new Date(ts);d.setHours(0,0,0,0);var n=Math.round((today0().getTime()-d.getTime())/DAY);return n<=0?"오늘":n===1?"어제":n<30?n+"일 전":fmtD(ts)}
/* 논의 요청에 묶인 리뷰 (ref가 같은 것), 최신순 */
function dRv(d){return S.reviews.filter(function(r){return r.ref===d.id}).sort(function(a,b){return b.ts-a.ts})}
function dRvP(d){return dRv(d).filter(function(r){return inP(r)})}
function dVis(d){return !!d.agenda||d.done||dRvP(d).length>0}
function rising(d){if(UI.period.mode==="all")return false;var c=cmpPrev(dRv(d));return c.cur>=3&&c.cur>=c.prev*2}
function scaleText(d){var c=cmpPrev(dRv(d));return pRange()+" "+c.cur+"건"+(UI.period.mode==="all"?"":" · "+prevLabel()+" "+c.prev+"건")}

  {k:"rule",g:"분류 자동화",t:"규칙 적중률",kind:"pct",f:function(R){var A=R.filter(function(r){return r.res!=="unsure"}),h=A.filter(function(r){return !!firstMatch(r.text)}).length;return {v:h,n:A.length,basis:"자동 분류 "+A.length+"건 중 규칙에 걸린 "+h+"건 · 나머지는 AI 추천"}}},

function testResult(text){
  if(!text.trim())return '<div class="result muted">입력하면 몇 번 규칙에 걸리는지 바로 보여 줘요</div>';
  var m=firstMatch(text);
  if(m)return '<div class="result">규칙 <b>#'+m.no+'</b>에 걸림 → <b>'+resultText(m.rule)+'</b><div class="xs muted" style="margin-top:3px">'+hl(text,m.rule)+'</div></div>';
  var fz=firstMatchFuzzy(text);
  if(fz)return '<div class="result"><span class="pill blue">AI 보정</span> 그대로는 맞는 규칙이 없지만, 보정하면 규칙 <b>#'+fz.no+'</b>에 걸림 → <b>'+resultText(fz.rule)+'</b><div class="xs muted" style="margin-top:3px">'+(fz.fixes.length?fz.fixes.map(function(f){return "'"+esc(f[0])+"' → '"+esc(f[1])+"'"}).join(", ")+" 로 읽었어요":"띄어쓰기·문장부호를 무시하고 읽었어요")+'</div></div>';
  return '<div class="result">맞는 규칙이 없어 <b>AI 추천</b>으로 넘어가요. 확신이 낮으면 리뷰확인의 <b>미분류</b>에 쌓여요</div>';
}

function readForm(){

function preview(){
  var box=$("#e-prev");if(!box)return;
  var f=readForm();var id=$("#ruleform").getAttribute("data-id");
  var draft={id:id?+id:-1,a:f.a,b:f.b,type:f.type,squad:f.squad,chapter:f.chapter,urgent:f.urgent,on:true};
  if(!draft.a.length){box.innerHTML='<div class="result muted">첫 묶음에 단어를 넣으면 몇 건이 걸리는지 보여 줘요</div>';return}
  var list=ordered().filter(function(r){return r.id!==draft.id});
  var pos=draft.urgent?S.rules.filter(function(r){return r.urgent&&r.id!==draft.id}).length:list.length;
  if(id){var cur=ruleById(+id);pos=ordered().indexOf(cur);list=ordered().map(function(r){return r.id===draft.id?draft:r})}else{list.splice(pos,0,draft)}
  var hits=S.reviews.filter(function(r){return matchRule(draft,r.text)});
  var changed=hits.filter(function(r){var before=firstMatch(r.text,ordered());var after=firstMatch(r.text,list);return !before||before.rule.id!==after.rule.id});
  box.innerHTML='<div class="result"><b>'+hits.length+'건</b> 매칭 · 지금과 결과가 달라지는 리뷰 <b>'+changed.length+'건</b></div>'+(hits.length?'<div class="list" style="margin-top:8px">'+hits.slice(0,4).map(function(r){return '<div class="rv"><div>'+hl(r.text,draft)+'</div><div class="meta">'+starL(r)+' · '+r.at+'</div></div>'}).join("")+'</div>':'');
}

/* VER10: 헤더에 "리뷰 수집: MM/DD HH:mm 기준"(리뷰확인 탭은 자체 표시가 있어 제외),
   마지막 수집에서 24시간이 지나면 헤더 위에 노란 배너 + [수동 입력](VOC 연동 창의 첨부하기로) */
var COL_STALE=24*36e5;
function colAt(){return S.lastCol||new Date(EXAMPLE_AT).getTime()}
function colStale(){return Date.now()-colAt()>COL_STALE}
function fmtMD(ts){var d=new Date(ts),p=function(n){return String(n).padStart(2,"0")};return p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
function colBadge(){return '<span class="colbadge'+(colStale()?' stale':'')+'"><i aria-hidden="true"></i>리뷰 수집: <span class="mono">'+fmtMD(colAt())+'</span> 기준</span>'}
function drawColbar(){var top=$("#top");if(!top)return;var bar=$("#colbar");
  if(!colStale()){if(bar)bar.remove();return}
  if(bar)return;
  bar=document.createElement("div");bar.id="colbar";bar.className="statwarn colbar";bar.setAttribute("role","alert");
  bar.innerHTML='<span>리뷰 수집이 멈췄어요. 그동안 들어온 리뷰는 수동 입력으로 추가할 수 있어요.</span><button class="btn sm" type="button" data-a="colmanual">수동 입력</button>';
  top.parentNode.insertBefore(bar,top)}
function render(){
  renderNav();
  var v=UI.view;
  var map={board:[boardTop,boardBody],done:[doneTop,doneBody],discuss:[discussTop,discussBody],reviews:[reviewsTop,reviewsBody],perf:[perfTop,perfBody],rules:[rulesTop,rulesBody],people:[peopleTop,peopleBody]}[v];
  var th=map[0]();if(v!=="reviews")th=th.replace("</h1>","</h1>"+colBadge()); /* VER10: 수집 시각 */
  $("#top").innerHTML=th;
  $("#body").innerHTML=map[1]();
  drawColbar(); /* VER10: 수집 멈춤 배너 */
  persist();
}

// 상자 안 꼬리표: '자동 ?'·'AI ?'는 눌러서 설명, '규칙'은 분류규칙으로 이동

    ];

      '<div class="exflow">'+cells.map(function(x,i){return '<div class="exstep"><div class="k">'+FLOW[i][0]+' '+FLOW[i][1]+'</div><div>'+x+'</div></div>'}).join("")+'</div>'+
      '<div class="exgo"><button class="go" type="button" data-a="goticket" data-id="'+t4.id+'">'+t4.id+' 열어 보기</button><a class="go" href="#discuss" data-a="mclose">논의보드에서 '+c9.id+' 보기</a></div></div>';

/* ---------- 통계자료: VOC 현황(업무용, 기본) / fixly 현황(발표용) ---------- */
/* 원래 perfTop·perfBody보다 뒤에 선언해 덮어씀. fixly 현황 탭은 원래 KPI 카드 9개를 그대로 씀 */
var PTABS=[["voc","VOC 현황"],["fixly","fixly 현황"]];
function dById(id){return S.discuss.filter(function(x){return x.id===id})[0]}
// 리뷰가 간 팀 (티켓·논의 요청을 따라감). 미분류·제외는 팀 없음
function sqOf(r){if(r.res==="ticket"||r.res==="urgent"){var t=tk(r.ref);return t?t.squad:""}if(r.res==="request"){var d=dById(r.ref);return d?d.squad:""}return ""}
function vocRv(){return S.reviews.filter(function(r){return !UI.psq||sqOf(r)===UI.psq})}
function inR(r,R){return r.ts>=R.s&&r.ts<R.e}
// 직전 기간: 월이면 지난달, 일이면 전날, 전체면 없음
function prevR(){var R=pRangeTs(),P=UI.period;if(P.mode==="all")return null;if(P.mode==="month"){var d=new Date(R.s);return {s:new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),e:R.s}}return {s:R.s-DAY,e:R.s}}
function avgStar(L){if(L.length){L=L.filter(function(r){return r.star>0});if(!L.length)return 0}return L.length?L.reduce(function(s,r){return s+r.star},0)/L.length:null}
function lowRate(L){return L.length?L.filter(function(r){return r.star<=2}).length/L.length:null}
function pct(x){return x==null?"–":Math.round(x*100)+"%"}
function medianOf(a){return median(a.filter(function(x){return x!=null&&isFinite(x)}))}
// 이슈 = 리뷰가 묶인 티켓 + 논의 요청
function issues(){
  var L=S.tickets.filter(function(t){return t.src==="ai"&&!t.from}).map(function(t){return {kind:"티켓",id:t.id,title:t.title,squad:t.squad,st:ST.filter(function(s){return s[0]===t.st})[0][1],pri:t.pri}});
  S.discuss.forEach(function(d){L.push({kind:"요청",id:d.id,title:d.title,squad:d.squad,st:d.done?"티켓 전환됨":d.agenda?"안건":"요청"})});
  return L.filter(function(x){return !UI.psq||x.squad===UI.psq}).map(function(x){x.rv=S.reviews.filter(function(r){return r.ref===x.id});x.likes=x.rv.reduce(function(s,r){return s+(r.likes||0)},0);return x});
}
// 리뷰가 있는 첫 달부터 마지막 달까지 한 달씩
function monthsAll(){var ts=S.reviews.map(function(r){return r.ts}),a=new Date(Math.min.apply(null,ts)),b=Math.max.apply(null,ts),out=[],d=new Date(a.getFullYear(),a.getMonth(),1);while(d.getTime()<=b){var e=new Date(d.getFullYear(),d.getMonth()+1,1);out.push({s:d.getTime(),e:e.getTime(),l:(d.getMonth()+1)+"월",y:d.getFullYear(),m:d.getMonth()+1});d=e}return out}
function verCmp(a,b){var x=a.split("."),y=b.split(".");for(var i=0;i<Math.max(x.length,y.length);i++){var d=(+x[i]||0)-(+y[i]||0);if(d)return d}return 0}
function ago(ts){return Math.max(0,Math.floor((today0().getTime()-new Date(ts).setHours(0,0,0,0))/DAY))}

/* 막대·선 그래프 (한 그래프에 축 하나). 칸마다 투명 hit 영역에 data-tip → 마우스를 올리면 설명 */
function vBars(vals,labels,tips,hi){
  var W=320,H=128,L=6,R=6,T=16,B=20,n=vals.length,cw=(W-L-R)/n,bw=Math.min(22,cw*.62),mx=Math.max.apply(null,vals.concat([1])),h0=H-B;
  var g='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+h0+'" y2="'+h0+'" stroke="var(--line)"/>';
  vals.forEach(function(v,i){var x=L+cw*i+(cw-bw)/2,h=v?Math.max(2,v/mx*(h0-T)):0,y=h0-h,r=Math.min(4,h,bw/2);
    if(h)g+='<path d="M'+x+' '+h0+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+bw-r)+'Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)+'V'+h0+'Z" fill="var(--accent)" opacity="'+(hi==null||hi===i?1:.45)+'"/>';
    if(hi===i||(hi==null&&v===mx))g+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="10" fill="var(--fg)">'+v+'</text>';
    g+='<text x="'+(L+cw*i+cw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--faint)">'+labels[i]+'</text>';
    g+='<rect x="'+(L+cw*i)+'" y="0" width="'+cw+'" height="'+h0+'" fill="transparent" data-tip="'+esc(tips[i])+'"/>'});
  return '<svg class="vchart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}
function vLine(vals,lo,hi_,labels,tips,fmtv,hi){
  var W=320,H=128,L=30,R=10,T=14,B=20,n=vals.length,cw=(W-L-R)/Math.max(1,n-1),h0=H-B,y=function(v){return h0-(v-lo)/(hi_-lo)*(h0-T)};
  var g='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+h0+'" y2="'+h0+'" stroke="var(--line)"/><line x1="'+L+'" x2="'+(W-R)+'" y1="'+T+'" y2="'+T+'" stroke="var(--line-2)"/>'+
    '<text x="'+(L-6)+'" y="'+(T+3)+'" text-anchor="end" font-size="10" fill="var(--faint)">'+fmtv(hi_)+'</text><text x="'+(L-6)+'" y="'+(h0+3)+'" text-anchor="end" font-size="10" fill="var(--faint)">'+fmtv(lo)+'</text>';
  var pts=[];vals.forEach(function(v,i){if(v!=null)pts.push([L+cw*i,y(v),i,v])});
  if(pts.length)g+='<path d="'+pts.map(function(p,k){return (k?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}).join("")+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach(function(p){var on=hi==null?p[2]===n-1:p[2]===hi;g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(on?4.5:3)+'" fill="'+(on?"var(--accent)":"var(--surface)")+'" stroke="var(--accent)" stroke-width="2"/>';
    if(on)g+='<text x="'+p[0]+'" y="'+(p[1]-9)+'" text-anchor="middle" font-size="10" fill="var(--fg)">'+fmtv(p[3])+'</text>'});
  labels.forEach(function(l,i){var x=L+cw*i;g+='<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--faint)">'+l+'</text><rect x="'+(x-cw/2)+'" y="0" width="'+cw+'" height="'+h0+'" fill="transparent" data-tip="'+esc(tips[i])+'"/>'});
  return '<svg class="vchart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}
// 공용 말풍선: data-tip이 있는 요소에 마우스를 올리면 그 위에 뜸
var vtip=null;
document.addEventListener("mouseover",function(e){
  var t=e.target.closest&&e.target.closest("[data-tip]");
  if(!t){if(vtip)vtip.hidden=true;return}
  if(!vtip){vtip=document.createElement("div");vtip.className="vtip";vtip.setAttribute("role","tooltip");document.body.appendChild(vtip)}
  vtip.textContent=t.getAttribute("data-tip");vtip.hidden=false;
  var rc=t.getBoundingClientRect();vtip.style.left=Math.max(8,Math.min(window.innerWidth-vtip.offsetWidth-8,rc.left+rc.width/2-vtip.offsetWidth/2))+"px";vtip.style.top=Math.max(8,rc.top-vtip.offsetHeight-6)+"px";
});

/* 맨 위 숫자 칸: 지금 기간 값 + 직전 기간 대비 (좋아짐·나빠짐은 화살표와 글로도 표시) */
function vTile(label,val,sub,d){return '<div class="vtile"><div class="l">'+label+'</div><div class="v">'+val+'</div><div class="d'+(d&&d.cls?" "+d.cls:"")+'">'+(d?d.txt:"")+(sub?'<span class="faint">'+sub+'</span>':'')+'</div></div>'}
function vDelta(cur,prev,fmtd,upGood){
  if(cur==null||prev==null)return null;var df=cur-prev;if(Math.abs(df)<1e-9)return {txt:"– "+prevLabel()+"과 같음 ",cls:""};
  var good=upGood==null?null:(df>0)===upGood;return {txt:(df>0?"▲ ":"▼ ")+fmtd(Math.abs(df))+" "+prevLabel()+" 대비"+(good==null?"":good?" · 좋아짐":" · 나빠짐")+" ",cls:good==null?"":good?"good":"bad"};
}
function vocTiles(){
  /* VER10: 계산 중 오류가 나면 5칸 모두 "–" + 노란 안내 */
  try{statGuard();return vocTilesCalc()}
  catch(e){if(window.console)console.warn("[fixly] VOC 현황 숫자 칸 계산 실패",e);
    return statWarn()+'<div class="vtiles">'+["리뷰 수","평균 별점","긴급 이슈 "+urgHelp(),"★1~2 답글률","가장 오래 열린 티켓"].map(function(l){return vTile(l,"–","",null)}).join("")+'</div>'}
}
function vocTilesCalc(){
  var all=vocRv(),R=pRangeTs(),PR=prevR(),cur=all.filter(function(r){return inR(r,R)}),prv=PR?all.filter(function(r){return inR(r,PR)}):null;
  var lowCur=cur.filter(function(r){return r.star<=2}),lowRep=lowCur.filter(function(r){return r.rts});
  var urgN=issues().filter(function(x){return isBurst(x.id)}).length;
  var open=S.tickets.filter(function(t){return t.st!=="done"&&t.at&&(!UI.psq||t.squad===UI.psq)}),oldest=open.length?Math.max.apply(null,open.map(function(t){return ago(t.at)})):null;
  return '<div class="vtiles">'+
    vTile("리뷰 수",cur.length+'<span class="u">건</span>',"",prv&&vDelta(cur.length,prv.length,function(x){return x+"건"},null))+
    vTile("평균 별점",cur.length?"★"+avgStar(cur).toFixed(2):"–","",prv&&prv.length&&vDelta(avgStar(cur),avgStar(prv),function(x){return x.toFixed(2)},true))+
    vTile("긴급 이슈 "+urgHelp(),urgN+'<span class="u">개</span>',"하루 "+URG_N+"건 이상 몰린 적 있는 이슈",null)+
    vTile("★1~2 답글률",pct(lowCur.length?lowRep.length/lowCur.length:null),lowCur.length?lowRep.length+" / "+lowCur.length+"건에 스토어 답글":"",null)+
    vTile("가장 오래 열린 티켓",oldest==null?"–":oldest+'<span class="u">일째</span>',"열린 티켓 "+open.length+"개 중",null)+
  '</div>';
}

/* ① 별점 추이: 월별 리뷰 수 · 평균 별점 · ★1~2 비율을 각각 따로 (축 하나씩) + 기간 별점 분포 */
function vocTrend(){
  var all=vocRv(),M=monthsAll(),R=pRangeTs(),hi=null;

/* ---------- VER8: 규칙으로 분류해 회사 전용 데이터 만들기 ---------- */
function clone(x){return JSON.parse(JSON.stringify(x))}
function orgUsers(co){return ORGS[co].users||DATA.users}
// A회사: 기존 규칙 16개 뒤에 공통 기본 규칙을 덧붙임(처음 맞는 규칙 하나만 쓰므로 기존 규칙이 먼저)
var A_ROUTE={crash:"공통",login:"공통",pay:"공통",order:"공통",delivery:"배송/물류",refund:"배송/물류",cs:"공통",slow:"공통",noti:"공통",update:"공통",benefit:"공통",ads:"광고",ask:"공통"};
function orgRules(co){var o=ORGS[co];if(o.rules)return clone(o.rules);var L=clone(DATA.rules);L.forEach(function(r){if(!r.name)r.name=A_NAMES[r.id]||""});var n=L.reduce(function(m,r){return Math.max(m,r.id)},0);genRules(A_ROUTE).forEach(function(r){r.id=++n;L.push(r)});return L}
function exampleRaw(){return DATA.reviews.filter(function(r){return !r.tmp}).map(function(r){return {reviewId:r.id,iso:r.iso,store:r.store,star:r.star,likes:r.likes,ver:r.ver,text:r.text,rp:r.rp}})}
function seedA(){var o=seedA0();o.rules.forEach(function(r){if(!r.name)r.name=A_NAMES[r.id]||""});return o}
/* 규칙에 걸리지 않은 ★1~3 리뷰(처리 결과 unsure)는 '미분류'. 티켓도 논의 요청도 아니고, 규칙을 만들면 다시 분류돼 티켓·논의 요청으로 바뀜 */
function nextCid(o){var m=0;o.discuss.forEach(function(d){var k=+String(d.id).replace(/\D/g,"");if(k>m)m=k});return "C-"+String(m+1).padStart(2,"0")}
// 잠깐 썼던 '논의 필요 리뷰' 묶음(need)이 저장돼 있으면 걷어 내고 리뷰를 다시 미분류로
function migrateNeed(o){var ids=o.discuss.filter(function(d){return d.need}).map(function(d){return d.id});if(!ids.length)return;o.discuss=o.discuss.filter(function(d){return !d.need});o.reviews.forEach(function(r){if(ids.indexOf(r.ref)>=0)r.ref=""})}
// 리뷰 목록으로 회사 전용 데이터(S) 새로 만들기
function buildWs(co,raw,info){
  var o={users:clone(orgUsers(co)),reviews:[],tickets:[],discuss:[],rules:orgRules(co),requests:[],sugg:[],v:17,hist:[],areaLog:{},seq:100,dseq:0,co:co};
  o.ruleSeq=o.rules.reduce(function(m,r){return Math.max(m,r.id)},0)+1;
  o.lastCol=new Date(info&&info.collectedAt||EXAMPLE_AT).getTime();
  addReviews(o,raw);
  return o;
}
// 새 리뷰를 더하고 규칙으로 분류 (이미 받은 리뷰는 건너뜀). 더한 리뷰 목록을 돌려줌
function addReviews(o,raw){
  var seen={},n0=0;o.reviews.forEach(function(r){if(r.rid)seen[r.rid]=1;var k=+String(r.id).replace(/\D/g,"");if(!isNaN(k)&&k>=n0)n0=k+1});
  var add=[];
  (raw||[]).forEach(function(x){var rid=x.reviewId||"";if(rid&&seen[rid])return;var ts=new Date(x.iso).getTime();if(isNaN(ts)||!x.text)return;if(rid)seen[rid]=1;
    add.push({id:"r"+(n0++),rid:rid,iso:x.iso,ts:ts,at:fmt(ts),store:x.store||"구글플레이",star:+x.star||0,likes:+x.likes||0,ver:x.ver||"미상",text:String(x.text),res:"",ref:"",fixed:false,rp:x.rp||null,rts:x.rp?new Date(x.rp).getTime():undefined})});
  o.reviews=add.concat(o.reviews).sort(function(a,b){return b.ts-a.ts});
  classifyInto(o,add);
  return add;
}
// 규칙을 위에서부터 보고 처음 맞는 규칙 하나 → 오류는 티켓, 개선 요청은 논의보드, 없으면 ★4~5는 제외(칭찬)·나머지는 미분류
function classifyInto(o,add){
  var rules=o.rules.filter(function(r){return r.urgent}).concat(o.rules.filter(function(r){return !r.urgent})),groups={},order=[];
  add.forEach(function(r){var m=null;for(var i=0;i<rules.length;i++){if(matchRule(rules[i],r.text)){m=rules[i];break}}
    if(m&&m.type==="제외"){r.res="excluded";r.why="규칙 제외";return}
    if(m&&m.type==="개선 요청"&&r.star===5)m=null; // 만족한 리뷰 속 단어(쿠폰 많아서 좋아요 등)는 요청으로 보지 않음
    if(!m){if(r.star>=4){r.res="excluded";r.why="칭찬"}else r.res="unsure";return}
    if(!groups[m.id]){groups[m.id]={rule:m,rv:[]};order.push(m.id)}groups[m.id].rv.push(r)});
  order.forEach(function(k){var g=groups[k],ru=g.rule,title=ru.name||(ru.a.slice(0,2).join("·")+" 관련");
    if(ru.type==="개선 요청"){
      var d=o.discuss.filter(function(x){return x.rule===ru.id&&!x.done})[0];
      if(!d){d={id:nextCid(o),title:title,squad:ru.squad,cm:[],done:false,rule:ru.id};o.discuss.push(d)}
      g.rv.forEach(function(r){r.res="request";r.ref=d.id});
    }else{
      var t=o.tickets.filter(function(x){return x.rule===ru.id&&x.src==="ai"&&x.st!=="done"})[0],isNew=!t;
      if(!t){o.seq=(o.seq||100)+1;t={id:"T-"+o.seq,title:title,squad:ru.squad,chapter:ru.chapter,pri:"보통",st:"todo",src:"ai",n:0,owner:pickOwner(o,ru.squad,ru.chapter),due:"",rule:ru.id,rv:[],cm:[],type:"오류",d:{},by:{},at:0};o.tickets.push(t)}
      g.rv.forEach(function(r){r.res="ticket";r.ref=t.id});
      t.rv=g.rv.map(function(r){return r.id}).concat(t.rv);t.n=t.rv.length;
      fillTicket(o,t,isNew);
    }
  });
}
// 담당자: 그 팀·담당업무 팀원 → 그 팀·담당업무 누구든 → 그 담당업무 팀장 → 관리자. 같은 조건이면 열린 티켓이 적은 사람
function pickOwner(o,sq,ch){
  var load=function(n){return o.tickets.filter(function(t){return t.owner===n&&t.st!=="done"}).length};
  var tiers=[function(u){return u.squad===sq&&u.chapter===ch&&u.role==="팀원"},function(u){return u.squad===sq&&u.chapter===ch},function(u){return u.chapter===ch&&u.role==="팀장"},function(u){return u.role==="관리자"}];
  for(var i=0;i<tiers.length;i++){var c=o.users.filter(tiers[i]);if(c.length){c.sort(function(a,b){return load(a.name)-load(b.name)});return c[0].name}}
  return "미배정";
}
// 티켓 내용 채우기: 현상(대표 리뷰)·환경(주요 버전)·영향 규모. 사람이 고친 칸은 그대로 둠. 하루 5건 이상 몰리면 긴급
function fillTicket(o,t,isNew){
  var by={};o.reviews.forEach(function(r){by[r.id]=r});
  var L=t.rv.map(function(id){return by[id]}).filter(Boolean).sort(function(a,b){return a.ts-b.ts});if(!L.length)return;
  var days={};L.forEach(function(r){var k=dueOf(r.ts);days[k]=(days[k]||0)+1});
  var burst=Object.keys(days).filter(function(k){return days[k]>=5});
  L.forEach(function(r){r.res=burst.indexOf(dueOf(r.ts))>=0?"urgent":"ticket"});
  var SL=L.filter(function(r){return r.star>0}),avg=SL.length?SL.reduce(function(s,r){return s+r.star},0)/SL.length:3;
  var pri=burst.length?"긴급":(L.length>=10||(L.length>=5&&avg<=1.5))?"높음":"보통";
  if(isNew||PRI.indexOf(pri)<PRI.indexOf(t.pri))t.pri=pri;
  if(isNew){var third=L[Math.min(2,L.length-1)];t.at=Math.min(Date.now(),third.ts+2*36e5);t.due=dueIn(t.pri==="긴급"?1:t.pri==="높음"?3:7)}
  var vc={};L.forEach(function(r){if(r.ver&&r.ver!=="미상")vc[r.ver]=(vc[r.ver]||0)+1});
  var mv=Object.keys(vc).sort(function(a,b){return vc[b]-vc[a]})[0];

function unzipEntries(buf){var u8=new Uint8Array(buf),dv=new DataView(buf),e=u8.length-22;

  for(var i=0;i<cnt;i++){if(dv.getUint32(off,true)!==0x02014b50)break;var nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true);
    files[td.decode(u8.subarray(off+46,off+46+nl))]={m:dv.getUint16(off+10,true),cs:dv.getUint32(off+20,true),lh:dv.getUint32(off+42,true)};off+=46+nl+xl+cl}
  return {names:Object.keys(files),get:function(name){var f=files[name];if(!f)return Promise.resolve(null);var l=f.lh,s=l+30+dv.getUint16(l+26,true)+dv.getUint16(l+28,true),data=u8.slice(s,s+f.cs);
    if(f.m===0)return Promise.resolve(td.decode(data));
    if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("이 브라우저는 엑셀을 읽지 못해요. CSV로 저장해 첨부해 주세요"));
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer().then(function(b){return td.decode(new Uint8Array(b))})}}}
function xlsxRows(buf){var z=unzipEntries(buf),P=new DOMParser();
  var sheet=z.names.filter(function(n){return /^xl\/worksheets\/sheet\d+\.xml$/.test(n)}).sort(function(a,b){return +a.replace(/\D/g,"")-(+b.replace(/\D/g,""))})[0];
  if(!sheet)throw new Error("엑셀에서 시트를 찾지 못했어요");
  return Promise.all([z.get("xl/sharedStrings.xml"),z.get(sheet)]).then(function(x){
    var ss=x[0]?Array.prototype.map.call(P.parseFromString(x[0],"application/xml").getElementsByTagName("si"),function(si){return Array.prototype.map.call(si.getElementsByTagName("t"),function(t){return t.textContent}).join("")}):[];
    var doc=P.parseFromString(x[1],"application/xml"),rows=[];
    Array.prototype.forEach.call(doc.getElementsByTagName("row"),function(row){var ri=(+row.getAttribute("r")||rows.length+1)-1,r=[];
      Array.prototype.forEach.call(row.getElementsByTagName("c"),function(c){var ref=c.getAttribute("r")||"",col=0,m=ref.match(/^[A-Z]+/);if(m)for(var k=0;k<m[0].length;k++)col=col*26+m[0].charCodeAt(k)-64;col=col?col-1:r.length;
        var t=c.getAttribute("t"),v=c.getElementsByTagName("v")[0],val;
        if(t==="s")val=ss[+(v&&v.textContent)]||"";else if(t==="inlineStr")val=Array.prototype.map.call(c.getElementsByTagName("t"),function(n){return n.textContent}).join("");else val=v?v.textContent:"";
        r[col]=val});

    for(var i=0;i<rows.length;i++)if(!rows[i])rows[i]=[];

function csvRows(text){text=text.replace(/^﻿/,"");var rows=[],r=[],c="",q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows}

function vocDate(v){v=String(v==null?"":v).trim();var m=v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})\.?(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){var d=new Date(+m[1],+m[2]-1,+m[3],+(m[4]||9),+(m[5]||0),+(m[6]||0));if(!isNaN(d))return isoLocal(d)}

function vocFromRows(rows){
  var hi=-1;rows.forEach(function(r,i){if(hi<0&&r.some(function(v){return String(v||"").trim()==="내용"}))hi=i});
  if(hi<0)throw new Error("'내용' 칸이 있는 줄을 찾지 못했어요. 양식을 내려받아 써 주세요");
  var H=rows[hi].map(function(v){return String(v||"").trim()}),col=function(k){return H.indexOf(k)};
  var out=[];rows.slice(hi+1).forEach(function(r){var g=function(k){var i=col(k);return i<0?"":String(r[i]==null?"":r[i]).trim()};var text=g("내용");if(!text)return;
    var iso=vocDate(g("날짜")),st=Math.round(+g("별점"));if(!(st>=1&&st<=5))st=0;
